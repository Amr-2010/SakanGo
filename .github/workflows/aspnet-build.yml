name: ASP.NET Core migration build
on:
  push:
    branches: [aspnet-core-migration]
  pull_request:
    paths: ['aspnet/**', '.github/workflows/aspnet-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore aspnet/SakanGo.Api.csproj
      - run: dotnet build aspnet/SakanGo.Api.csproj --configuration Release --no-restore
      - run: docker build -f aspnet/Dockerfile -t sakango-aspnet:ci .
